<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Staff Login — Learning Event</title>
<style>
  :root{
    --ink:#211712;
    --ink-soft:#6B5A4E;
    --paper:#FBF7F1;
    --panel:#FFFFFF;
    --border:#E8DCCB;
    --accent:#FA9411;
    --accent-dark:#C96F05;
    --bad:#E12900;
    --bad-soft:#FCE0D6;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100%;
    padding:24px;
  }
  .card{
    width:100%;
    max-width:380px;
    background:var(--panel);
    border:1px solid var(--border);
    border-top:3px solid var(--accent);
    border-radius:16px;
    padding:32px;
  }
  .eyebrow{
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.1em;
    color:var(--accent-dark);
  }
  h1{
    font-size:20px;
    margin:8px 0 4px 0;
    color:var(--ink);
  }
  .sub{
    font-size:13px;
    color:var(--ink-soft);
    margin:0 0 22px 0;
    line-height:1.5;
  }
  label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .pw-row{position:relative;}
  input[type="password"], input[type="text"]{
    width:100%;
    padding:11px 40px 11px 14px;
    border:1px solid var(--border);
    border-radius:10px;
    font-size:14px;
    background:#FAF7F2;
    color:var(--ink);
  }
  input:focus{outline:none;border-color:var(--accent);background:#fff;}
  .toggle-btn{
    position:absolute;
    right:8px;
    top:50%;
    transform:translateY(-50%);
    border:none;
    background:none;
    color:var(--ink-soft);
    font-size:12px;
    cursor:pointer;
    padding:6px 8px;
  }
  .error{
    margin-top:12px;
    background:var(--bad-soft);
    color:var(--bad);
    border-radius:8px;
    padding:10px 12px;
    font-size:12.5px;
    font-weight:600;
  }
  button.submit{
    width:100%;
    margin-top:18px;
    padding:12px;
    border:none;
    border-radius:10px;
    background:var(--accent);
    color:#fff;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
  }
  button.submit:hover{background:var(--accent-dark);}
  button.submit:disabled{opacity:.6;cursor:not-allowed;}
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Staff Portal</div>
    <h1>Sign in to check-in desk</h1>
    <p class="sub">Only authorized event staff can access attendee records and check-in.</p>
    <form id="login-form">
      <label>Staff Password</label>
      <div class="pw-row">
        <input type="password" id="password" placeholder="Enter password" required />
        <button type="button" class="toggle-btn" id="toggle-pw">Show</button>
      </div>
      <div id="error-box"></div>
      <button type="submit" class="submit" id="submit-btn">Sign in</button>
    </form>
  </div>

  <script>
    const API_BASE = "/api";
    const form = document.getElementById('login-form');
    const pwInput = document.getElementById('password');
    const toggleBtn = document.getElementById('toggle-pw');
    const errorBox = document.getElementById('error-box');
    const submitBtn = document.getElementById('submit-btn');

    toggleBtn.addEventListener('click', () => {
      const isPw = pwInput.type === 'password';
      pwInput.type = isPw ? 'text' : 'password';
      toggleBtn.textContent = isPw ? 'Hide' : 'Show';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.innerHTML = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in…';
      try {
        const res = await fetch(`${API_BASE}/staff/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pwInput.value })
        });
        const data = await res.json();
        if (!res.ok) {
          errorBox.innerHTML = `<div class="error">${data.error || 'Login failed'}</div>`;
          return;
        }
        localStorage.setItem('staff_token', data.token);
        const params = new URLSearchParams(window.location.search);
        window.location.href = params.get('next') || '/index.html';
      } catch (err) {
        errorBox.innerHTML = `<div class="error">Unable to connect to backend.</div>`;
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
