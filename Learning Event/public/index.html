<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YEAR 2 LEARNING EVENT — Registrations</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#211712;
    --ink-soft:#6B5A4E;
    --paper:#ffffff;
    --panel:#FFFFFF;
    --border:#E8DCCB;
    --header-bg:#fffefc;
    --accent:#FA9411;
    --accent-dark:#C96F05;
    --accent-soft:#FDE9CF;
    --good:#1F1A16;
    --good-soft:#EDE8E1;
    --bad:#E12900;
    --bad-soft:#FCE0D6;
    --muted:#948B80;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    height:100%;
  }

  body{
    background:var(--paper);
    color:var(--ink);
  }

  .wrap{
    max-width:1400px;
    margin:0 auto;
    padding:28px 32px;
  }

  .header{
    background:var(--panel);
    border:1px solid var(--border);
    border-top:3px solid var(--accent);
    border-radius:16px;
    padding:22px 26px;
    margin-bottom:18px;
  }
  .header-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
    flex-wrap:wrap;
  }

  .title-input{
    font-size:32px;
    font-weight:700;
    border:none;
    background:transparent;
    color:var(--ink);
    padding:2px 0;
    width:100%;
    max-width:440px;
    letter-spacing:-.01em;
  }

  .title-input:focus{
    outline:none;
    border-bottom:1px solid var(--accent);
  }

  .date-input{
    border:none;
    background:transparent;
    color:var(--ink-soft);
    font-size:13px;
    margin-top:4px;
    padding:2px 0;
  }
  .date-input:focus{
    outline:none;
    border-bottom:1px solid var(--accent);
  }
  .actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }

  .btn{
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--ink);
    padding:9px 14px;
    border-radius:10px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .btn:hover{
    border-color:var(--ink-soft);
  }
  .btn-primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .btn-primary:hover{
    background:var(--accent-dark);
    border-color:var(--accent-dark);
  }
  .btn-primary:disabled{
    background:var(--muted);
    border-color:var(--muted);
    cursor:not-allowed;
  }
  .btn-danger{
    color:var(--bad);
    border-color:var(--bad-soft);
  }

  .btn-danger:hover{
    background:var(--bad-soft);
  }

  .capacity-row{
    margin-top:18px;
  }
  .capacity-label{
    display:flex;
    justify-content:space-between;
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:6px;
  }

  .capacity-track{
    height:8px;
    background:var(--header-bg);
    border-radius:6px;
    overflow:hidden;
  }
  .capacity-fill{
    height:100%;
    background:var(--accent);
    transition:width .3s ease;
  }

  .capacity-fill.full{
    background:var(--bad);
  }
  .banner{
    margin-bottom:16px;
    padding:11px 16px;
    border-radius:10px;
    font-size:13.5px;
    font-weight:600;
  }

  .banner-warn{
    background:var(--bad-soft);
    color:var(--bad);
  }

  .banner-info{
    background:var(--accent-soft);
    color:var(--accent-dark);
  }

  .stats{
    display:flex;
    gap:14px;
    margin-bottom:16px;
    flex-wrap:wrap;
    color:rgb(212, 18, 4);
  }
    

 .stat{
  background:var(--header-bg);
  border:1px solid var(--border);
  border-top:3px solid purple;
  border-radius:12px;
  padding:14px 18px;
  min-width:150px;
  flex:1;
  box-shadow:5px 5px 6px 4px rgba(175, 175, 153, 0.322);

}

.stat.stat-total{
  border-top-color: #E12900;
}

.stat.stat-in{
  border-top-color:#1F1A16;
}
.stat.stat-out{
  border-top-color:#FA9411;
}
  
  .stat-label{
    font-size:12px;
    color:var(--muted);
    margin-bottom:4px;
  }

  .stat-value{
    font-size:24px;
    font-weight:700;
  }
  .stat-value.good{
    color:var(--good);
  }
  .stat-value.bad{
    color:var(--bad);
  }
  .controls{
    display:flex;
    gap:10px;
    margin-bottom:12px;
    flex-wrap:wrap;
  }

  .search{
    flex:1;
    max-width:1500px;
    min-width:200px;
    padding:10px 14px;
    border:1px solid var(--border);
    border-radius:10px;font-size:13.5px;
    background:var(--header-bg);
  }

  .search:focus{
    outline:none;
    border-color:var(--accent);
    background:var(--panel);
  }

  .chips{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .chip{
    padding:9px 14px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--header-bg);
    color:var(--ink-soft);
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
  }

  .chip.active{background:var(--accent);
    color:#fff;border-color:var(--accent);
  }

  .list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .row{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px 18px;
  }
  .row-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;flex-wrap:wrap;
  }

  .row-name{
    font-size:14.5px;
    font-weight:700;
  }
  .row-meta{font-size:12.5px;
    color:var(--ink-soft);
    margin-top:3px;
  }
  .row-meta span+span::before{
    content:" · ";color:var(--muted);
  }
  .badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:5px 11px;
    border-radius:20px;
    font-size:12px;
    font-weight:700;
    white-space:nowrap;
    
  }

.badge.in{
  background:#c4fcde;
  color:#000000;
}

.badge.out{
  background:var(--bad-soft);
  color:var(--bad);
}
.badge-dot{
  width:7px;
  height:7px;
  border-radius:50%;
}
.badge.in .badge-dot{
  background:#58C597;
}

.badge.out .badge-dot{
  background:var(--bad);
}

  .row-actions{
    display:flex;
    gap:8px;
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid var(--header-bg);
  }

  .row-btn{
    border:1px solid var(--border);
    background:var(--header-bg);
    padding:7px 13px;
    border-radius:9px;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    color:var(--ink);
  }

  .row-btn.state-out{
    background:#FA9411;
    border-color:#FFBC6E;
    color:#141413;
  }

  .row-btn.state-out:hover{
    background:#FFAD4D;
  }

  .row-btn.state-in{
    background:#ff9595;
    border-radius: 12px;
    color:#1c1d1d;
  
  }

  .row-btn.state-in:hover{
    background:#fa6d6d;
  }

  .row-btn.delete{
    color:var(--bad);
  }

  .row-btn.delete:hover{
    background:var(--bad-soft);
  }

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
  }
  .empty-title{
    font-size:14.5px;
    font-weight:700;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(33,23,18,.45);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:20px;
  }

  .modal{
    background:var(--panel);
    border-radius:16px;
    padding:26px;
    width:100%;
    max-width:420px;
  }

  .modal.wide{
    max-width:560px;
  }
  .modal h3{
    margin:0 0 4px 0;
    font-size:18px;
  }

  .modal p.sub{
    margin:0 0 18px 0;
    color:var(--muted);
    font-size:12.5px;
  }

  .field{
    margin-bottom:14px;
  }
  .field label{
    display:block;
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
    margin-bottom:5px;
  }

  .field input, .field textarea{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:9px;
    font-size:13.5px;
    background:var(--header-bg);
    color:var(--ink);
  }

  .field textarea{
    font-family:ui-monospace,Menlo,Consolas,monospace;
    min-height:140px;
    resize:vertical;
  }
  .field input:focus, .field textarea:focus{
    outline:none;
    border-color:var(--accent);
    background:#fff;
  }
  .file-drop{
    border:2px dashed var(--border);
    border-radius:10px;
    padding:20px;
    text-align:center;
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:14px;
    background:var(--header-bg);
    cursor:pointer;
  }
  .file-drop:hover{
    border-color:var(--accent);
  }
  .hint{
    font-size:12px;
    color:var(--muted);
    margin-top:6px;
  }

  .import-summary{
    background:var(--good-soft);
    color:var(--good);
    border-radius:9px;
    padding:11px 14px;
    font-size:13px;
    margin-top:12px;
  }

  .import-summary.issues{
    background:var(--accent-soft);
    color:var(--accent-dark);
  }
  .modal-actions{display:flex;
    gap:10px;
    justify-content:flex-end;
    margin-top:18px;
  }

  .error-text{
    color:var(--bad);
    font-size:12px;
    margin-top:10px;
  }

  .loading{
    padding:60px;
    text-align:center;
    color:var(--muted);
  }

  @media (max-width:760px){
    .wrap{padding:18px;}
    .stats{flex-direction:column;}
  }
</style>
</head>
<body>
  <div class="wrap" id="app"><div class="loading">Loading registrations…</div></div>

  <script>
  (function(){
    const API_BASE = "/api";
    let token = localStorage.getItem('staff_token');
    if(!token){
      window.location.href = '/login.html?next=' + encodeURIComponent(window.location.pathname);
      return;
    }

    const CAPACITY_DEFAULT = 140;
    let state = {
      loading: true,
      meta: { name: "YEAR 2 LEARNING EVENT", date: "", capacity: CAPACITY_DEFAULT },
      items: [],
      stats: { totalAttendees: 0, checkedInCount: 0, notCheckedInCount: 0 },
      search: "",
      filter: "all",
      modalOpen: false,
      editingId: null,
      formError: "",
      saving: false,
      importOpen: false,
      importRows: [],
      importFileName: "",
      importSummary: null
    };

    const root = document.getElementById('app');

    function esc(str){
      const d = document.createElement('div');
      d.innerText = str == null ? "" : str;
      return d.innerHTML;
    }
    function formatTime(iso){
  if(!iso) return "";
  try{
    return new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }catch(e){ return ""; }
}

    async function apiFetch(path, opts={}){
      const res = await fetch(`${API_BASE}${path}`, {
        ...opts,
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`,
          ...(opts.headers || {})
        }
      });
      if(res.status === 401){
        localStorage.removeItem('staff_token');
        window.location.href = '/login.html';
        throw new Error('Unauthorized');
      }
      return res;
    }

    async function loadMeta(){
      try{
        const res = await apiFetch('/staff/meta');
        if(res.ok) state.meta = Object.assign({}, state.meta, await res.json());
      }catch(e){ console.error(e); }
    }

    async function loadAttendees(){
      try{
        const params = new URLSearchParams();
        if(state.search.trim()) params.set('search', state.search.trim());
        if(state.filter === 'in') params.set('checkedIn', 'true');
        if(state.filter === 'out') params.set('checkedIn', 'false');
        const res = await apiFetch(`/staff/attendees?${params.toString()}`);
        if(res.ok){
          const data = await res.json();
          state.items = data.items || [];
          state.stats = data.stats || state.stats;
        }
      }catch(e){ console.error(e); }
    }

    async function saveMeta(){
      try{ await apiFetch('/staff/meta', { method: 'PUT', body: JSON.stringify(state.meta) }); }
      catch(e){ console.error(e); }
    }

    async function refreshAll(){
      await Promise.all([loadMeta(), loadAttendees()]);
      render();
    }

    function render(){
      if(state.loading){ root.innerHTML = '<div class="loading">Loading registrations…</div>'; return; }

      const total = state.items.length ? state.stats.totalAttendees : state.stats.totalAttendees;
      const checkedIn = state.stats.checkedInCount;
      const notCheckedIn = state.stats.notCheckedInCount;
      const capacity = state.meta.capacity || CAPACITY_DEFAULT;
      const pct = Math.min(100, Math.round((total/capacity)*100));
      const atCapacity = total >= capacity;
      const nearCapacity = !atCapacity && (capacity - total) <= 10;

      let banner = "";
      if(atCapacity) banner = `<div class="banner banner-warn">Capacity reached — ${total}/${capacity} registered.</div>`;
      else if(nearCapacity) banner = `<div class="banner banner-info">Only ${capacity-total} spot${capacity-total===1?"":"s"} left before capacity.</div>`;

      root.innerHTML = `
        <div class="header">
          <div class="header-top">
            <div>
              <input class="title-input" id="name-input" value="${esc(state.meta.name)}" placeholder="Event name" />
              <br/>
              <input class="date-input" id="date-input" value="${esc(state.meta.date)}" placeholder="" />
            </div>
            <div class="actions">
              <button class="btn" id="refresh-btn">↻ Refresh</button>
              <button class="btn" id="export-btn">⇩ Export</button>
              <button class="btn" id="import-btn" ${atCapacity?"disabled":""}>⇧ Import List</button>
              <button class="btn btn-primary" id="add-btn" ${atCapacity?"disabled":""}>+ Add Attendee</button>
              <button class="btn" id="signout-btn">Sign out</button>
            </div>
          </div>
          <div class="capacity-row">
            <div class="capacity-label">
              <span>${total} of <input id="capacity-input" value="${esc(capacity)}" style="width:44px;border:none;background:transparent;font-weight:700;color:var(--ink);" /> seats filled</span>
              <span>${pct}%</span>
            </div>
            <div class="capacity-track"><div class="capacity-fill ${atCapacity?'full':''}" style="width:${pct}%"></div></div>
          </div>
        </div>

        ${banner}

       <div class="stats">
            <div class="stat stat-total"><div class="stat-label">Total Registered</div><div class="stat-value">${total}</div></div>
            <div class="stat stat-in"><div class="stat-label">Checked In</div><div class="stat-value good">${checkedIn}</div></div>
            <div class="stat stat-out"><div class="stat-label">Not Checked In</div><div class="stat-value bad">${notCheckedIn}</div></div>
      </div>

        <div class="controls">
          <input class="search" id="search-input" placeholder="Search by name, phone, or email…" value="${esc(state.search)}" />
          <div class="chips">
            <button class="chip ${state.filter==='all'?'active':''}" data-filter="all">All</button>
            <button class="chip ${state.filter==='in'?'active':''}" data-filter="in">Checked In</button>
            <button class="chip ${state.filter==='out'?'active':''}" data-filter="out">Not Checked In</button>
          </div>
        </div>

        <div class="list">
          ${state.items.length === 0 ? `
            <div class="empty">
              <div class="empty-title">${total===0 ? "No one's on the list yet" : "No matches found"}</div>
              <div>${total===0 ? "Use Import List to bring in your attendees." : "Try a different name, phone, or email."}</div>
            </div>
          ` : state.items.map((a, idx) => `
  <div class="row">
    <div class="row-top">
      <div>
        <div class="row-name">${idx+1}. ${esc(a.name)}</div>
        <div class="row-meta">
          <span>${esc(a.organization) || "—"}</span>
          ${a.phone ? `<span>${esc(a.phone)}</span>` : ""}
          ${a.email ? `<span>${esc(a.email)}</span>` : ""}
        </div>
        ${a.checkedInAt || a.checkedOutAt ? `
          <div class="row-meta">
            ${a.checkedInAt ? `<span>Checked in at ${formatTime(a.checkedInAt)}</span>` : ""}
            ${a.checkedOutAt ? `<span>Checked out at ${formatTime(a.checkedOutAt)}</span>` : ""}
          </div>
        ` : ""}
      </div>
      <span class="badge ${a.checkedIn ? 'in':'out'}">
        <span class="badge-dot"></span>${a.checkedIn ? 'Checked In' : 'Not Checked In'}
      </span>
    </div>
    <div class="row-actions">
      <button class="row-btn ${a.checkedIn ? 'state-in' : 'state-out'}" data-toggle="${a.id}" data-current="${a.checkedIn ? '1' : '0'}">${a.checkedIn ? "Check out" : "Check in"}</button>
      <button class="row-btn" data-edit="${a.id}">Edit</button>
      <button class="row-btn delete" data-delete="${a.id}">Delete</button>
    </div>
  </div>
`).join("")}
        </div>

        ${state.modalOpen ? renderModal() : ""}
        ${state.importOpen ? renderImportModal() : ""}
      `;
      attachHandlers();
    }

    function renderModal(){
      const editing = state.editingId ? state.items.find(a=>a.id===state.editingId) : null;
      return `
        <div class="modal-overlay" id="modal-overlay">
          <div class="modal">
            <h3>${editing ? "Edit Attendee" : "Add Attendee"}</h3>
            <p class="sub">${editing ? "Update this person's details." : "Add someone to the list."}</p>
            <div class="field"><label>Full name *</label><input id="f-name" value="${esc(editing?editing.name:'')}" placeholder="e.g. Amaka Obi" /></div>
            <div class="field"><label>Phone number *</label><input id="f-phone" value="${esc(editing?editing.phone:'')}" placeholder="e.g. 0803 123 4567" /></div>
            <div class="field"><label>Email</label><input id="f-email" value="${esc(editing?editing.email:'')}" placeholder="e.g. amaka@company.com" /></div>
            <div class="field"><label>Organization</label><input id="f-org" value="${esc(editing?editing.organization:'')}" placeholder="e.g. Finance Team" /></div>
            ${state.formError ? `<div class="error-text">${esc(state.formError)}</div>` : ""}
            <div class="modal-actions">
              <button class="btn" id="modal-cancel">Cancel</button>
              <button class="btn btn-primary" id="modal-save" ${state.saving?"disabled":""}>${state.saving ? "Saving…" : (editing ? "Save Changes" : "Add Attendee")}</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderImportModal(){
      const capacity = state.meta.capacity || CAPACITY_DEFAULT;
      const remaining = Math.max(0, capacity - state.items.length);
      return `
        <div class="modal-overlay" id="import-overlay">
          <div class="modal wide">
            <h3>Import List</h3>
            <p class="sub">${remaining} spot${remaining===1?"":"s"} remaining before the ${capacity} cap.</p>
            <div class="file-drop" id="file-drop">
              📄 Click to choose a .xlsx or .csv file<br/>
              <span class="hint">Columns in this order: Name, Phone, Email, Organization</span>
              <input type="file" id="file-input" accept=".xlsx,.xls,.csv" style="display:none;" />
            </div>
            <p class="hint" style="text-align:center;margin:-6px 0 14px 0;">— or paste rows below —</p>
            <div class="field">
              <textarea id="import-textarea" placeholder="Amaka Obi, 0803 123 4567, amaka@company.com, Finance Team"></textarea>
              <div class="hint">Works with rows copied from Excel (tab-separated) too. Existing phone numbers are skipped automatically.</div>
            </div>
            ${state.importFileName ? `<div class="hint">Loaded: <strong>${esc(state.importFileName)}</strong> (${state.importRows.length} row${state.importRows.length===1?"":"s"})</div>` : ""}
            ${state.importSummary ? `
              <div class="import-summary ${state.importSummary.skipped>0 ? 'issues' : ''}">
                Added ${state.importSummary.added}.
                ${state.importSummary.duplicates>0 ? ` Skipped ${state.importSummary.duplicates} already on the list.` : ""}
                ${state.importSummary.overCapacity>0 ? ` ${state.importSummary.overCapacity} left out — capacity reached.` : ""}
                ${state.importSummary.invalid>0 ? ` ${state.importSummary.invalid} row(s) missing a name or phone.` : ""}
              </div>
            ` : ""}
            <div class="modal-actions">
              <button class="btn" id="import-cancel">Close</button>
              <button class="btn btn-primary" id="import-submit">Import</button>
            </div>
          </div>
        </div>
      `;
    }

    function parsePastedText(text){
      const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
      const rows = [];
      for(const line of lines){
        const parts = (line.includes('\t') ? line.split('\t') : line.split(','))
          .map(p=>p.trim().replace(/^"|"$/g,''));
        const [name, phone, email, organization] = parts;
        if(name && name.toLowerCase()==='name') continue;
        rows.push({ name: name||"", phone: phone||"", email: email||"", organization: organization||"" });
      }
      return rows;
    }

    function parseSheetFile(file){
      return new Promise((resolve, reject)=>{
        const reader = new FileReader();
        reader.onload = (e)=>{
          try{
            const wb = XLSX.read(e.target.result, { type: 'binary' });
            const sheet = wb.Sheets[wb.SheetNames[0]];
            const json = XLSX.utils.sheet_to_json(sheet, { header: 1 });
            const rows = [];
            for(const line of json){
              if(!line || !line.length) continue;
              const [name, phone, email, organization] = line;
              if(name && String(name).toLowerCase()==='name') continue;
              if(!name && !phone) continue;
              rows.push({
                name: name!=null?String(name).trim():"",
                phone: phone!=null?String(phone).trim():"",
                email: email!=null?String(email).trim():"",
                organization: organization!=null?String(organization).trim():""
              });
            }
            resolve(rows);
          }catch(err){ reject(err); }
        };
        reader.onerror = reject;
        reader.readAsBinaryString(file);
      });
    }

    function exportToExcel(){
      const rows = state.items.map((a, i) => ({
        "S/N": i+1,
        "Full Name": a.name,
        "Phone Number": a.phone,
        "Email Address": a.email || "",
        "Organization": a.organization || "",
        "Checked In": a.checkedIn ? "Yes" : "No"
      }));
      const ws = XLSX.utils.json_to_sheet(rows);
      ws['!cols'] = [{wch:5},{wch:26},{wch:18},{wch:28},{wch:26},{wch:12}];
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Attendees");
      const safeName = (state.meta.name || "attendees").toLowerCase().replace(/[^a-z0-9]+/g,'-');
      XLSX.writeFile(wb, `${safeName}-attendees.xlsx`);
    }

    function attachHandlers(){
      const nameInput = document.getElementById('name-input');
      if(nameInput) nameInput.addEventListener('change', async e=>{ state.meta.name = e.target.value; await saveMeta(); });
      const dateInput = document.getElementById('date-input');
      if(dateInput) dateInput.addEventListener('change', async e=>{ state.meta.date = e.target.value; await saveMeta(); });
      const capInput = document.getElementById('capacity-input');
      if(capInput) capInput.addEventListener('change', async e=>{
        const val = parseInt(e.target.value, 10);
        state.meta.capacity = isNaN(val)||val<=0 ? CAPACITY_DEFAULT : val;
        await saveMeta(); render();
      });

      const refreshBtn = document.getElementById('refresh-btn');
      if(refreshBtn) refreshBtn.addEventListener('click', async ()=>{ await refreshAll(); });

      const exportBtn = document.getElementById('export-btn');
      if(exportBtn) exportBtn.addEventListener('click', exportToExcel);

      const signoutBtn = document.getElementById('signout-btn');
      if(signoutBtn) signoutBtn.addEventListener('click', ()=>{
        localStorage.removeItem('staff_token');
        window.location.href = '/login.html';
      });

      const addBtn = document.getElementById('add-btn');
      if(addBtn) addBtn.addEventListener('click', ()=>{ state.modalOpen=true; state.editingId=null; state.formError=""; render(); });

      const importBtn = document.getElementById('import-btn');
      if(importBtn) importBtn.addEventListener('click', ()=>{
        state.importOpen=true; state.importSummary=null; state.importRows=[]; state.importFileName="";
        render();
      });

      const searchInput = document.getElementById('search-input');
      if(searchInput) searchInput.addEventListener('input', async e=>{
        state.search = e.target.value;
        await loadAttendees();
        render();
        const el = document.getElementById('search-input');
        if(el){ el.focus(); el.selectionStart = el.selectionEnd = el.value.length; }
      });

      document.querySelectorAll('.chip').forEach(btn=>{
        btn.addEventListener('click', async ()=>{
          state.filter = btn.getAttribute('data-filter');
          await loadAttendees();
          render();
        });
      });

      document.querySelectorAll('[data-toggle]').forEach(btn=>{
  btn.addEventListener('click', async ()=>{
    const id = btn.getAttribute('data-toggle');
    const isCurrentlyIn = btn.getAttribute('data-current') === '1';
    try{
      const res = await apiFetch(`/staff/attendees/${id}`, { method:'PATCH', body: JSON.stringify({ checkedIn: !isCurrentlyIn }) });
      if(res.ok){ await loadAttendees(); render(); }
    }catch(e){ console.error(e); }
  });
});

      document.querySelectorAll('[data-edit]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          state.modalOpen=true; state.editingId=btn.getAttribute('data-edit'); state.formError="";
          render();
        });
      });

      document.querySelectorAll('[data-delete]').forEach(btn=>{
        btn.addEventListener('click', async ()=>{
          const id = btn.getAttribute('data-delete');
          if(confirm('Remove this attendee from the list?')){
            try{
              const res = await apiFetch(`/staff/attendees/${id}`, { method:'DELETE' });
              if(res.ok){ await loadAttendees(); render(); }
            }catch(e){ console.error(e); }
          }
        });
      });

      const overlay = document.getElementById('modal-overlay');
      if(overlay) overlay.addEventListener('click', e=>{ if(e.target===overlay){ state.modalOpen=false; render(); } });
      const cancelBtn = document.getElementById('modal-cancel');
      if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ state.modalOpen=false; render(); });

      const saveBtn = document.getElementById('modal-save');
      if(saveBtn) saveBtn.addEventListener('click', async ()=>{
        const name = document.getElementById('f-name').value.trim();
        const phone = document.getElementById('f-phone').value.trim();
        const email = document.getElementById('f-email').value.trim();
        const org = document.getElementById('f-org').value.trim();
        if(!name || !phone){ state.formError="Name and phone number are required."; render(); return; }

        state.saving = true; render();
        try{
          let res;
          if(state.editingId){
            res = await apiFetch(`/staff/attendees/${state.editingId}`, { method:'PATCH', body: JSON.stringify({ name, phone, email, organization: org }) });
          } else {
            res = await apiFetch('/staff/attendees', { method:'POST', body: JSON.stringify({ name, phone, email, organization: org }) });
          }
          const data = await res.json();
          if(!res.ok){ state.formError = data.error || "Something went wrong."; state.saving=false; render(); return; }
          state.saving=false; state.modalOpen=false; state.editingId=null; state.formError="";
          await loadAttendees(); render();
        }catch(e){
          state.formError = "Network error — please try again.";
          state.saving=false; render();
        }
      });

      const importOverlay = document.getElementById('import-overlay');
      if(importOverlay) importOverlay.addEventListener('click', e=>{ if(e.target===importOverlay){ state.importOpen=false; render(); } });
      const importCancel = document.getElementById('import-cancel');
      if(importCancel) importCancel.addEventListener('click', ()=>{ state.importOpen=false; render(); });

      const fileDrop = document.getElementById('file-drop');
      const fileInput = document.getElementById('file-input');
      if(fileDrop && fileInput){
        fileDrop.addEventListener('click', ()=> fileInput.click());
        fileInput.addEventListener('change', async ()=>{
          const file = fileInput.files[0];
          if(!file) return;
          try{
            const rows = await parseSheetFile(file);
            state.importRows = rows;
            state.importFileName = file.name;
            render();
          }catch(e){
            alert("Couldn't read that file — try exporting it as .xlsx or .csv");
          }
        });
      }

      const importTextarea = document.getElementById('import-textarea');
      if(importTextarea) importTextarea.addEventListener('input', e=>{ state.importPastedText = e.target.value; });

      const importSubmit = document.getElementById('import-submit');
      if(importSubmit) importSubmit.addEventListener('click', async ()=>{
        const pastedRows = state.importPastedText ? parsePastedText(state.importPastedText) : [];
        const rows = state.importRows.length ? state.importRows : pastedRows;
        if(!rows.length){ alert("Choose a file or paste some rows first."); return; }

        try{
          const res = await apiFetch('/staff/attendees/import', { method:'POST', body: JSON.stringify({ rows }) });
          const summary = await res.json();
          await loadAttendees();
          state.importSummary = { ...summary, skipped: summary.duplicates + summary.overCapacity + summary.invalid };
          state.importRows = [];
          state.importFileName = "";
          state.importPastedText = "";
        }catch(e){
          state.importSummary = { added:0, duplicates:0, overCapacity:0, invalid: rows.length, skipped: rows.length };
        }
        render();
      });
    }

    (async function init(){
      await refreshAll();
      state.loading = false;
      render();
      setInterval(async ()=>{ if(!state.modalOpen && !state.importOpen){ await refreshAll(); } }, 15000);
    })();
  })();
  </script>
</body>
</html>
